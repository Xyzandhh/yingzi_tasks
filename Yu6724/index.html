<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="胡玉豪的个人简介：技术方向与兴趣、掌握的技能" />
<title>胡玉豪 · 个人简介</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23111111'/><text x='16' y='23' font-family='Helvetica,Arial,sans-serif' font-size='19' font-weight='700' fill='%23ffffff' text-anchor='middle'>H</text></svg>" />
<style>
  :root{
    --ink: #111111;
    --ink-soft: #3A3A3A;
    --ink-mute: #8A8A8A;
    --rule: #E6E6E6;
    --paper: #FFFFFF;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", sans-serif;
    --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Consolas, "Liberation Mono", "Courier New", monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }
  ::selection{background: var(--ink); color: var(--paper);}
  .page{max-width: 820px; margin: 0 auto; padding: 0 28px;}

  header.hero{
    padding: 78px 0 30px;
    border-bottom: 2px solid var(--ink);
  }
  .kicker{
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }
  .hero h1{
    margin-top: 16px;
    font-size: clamp(2.1rem, 6vw, 3rem);
    font-weight: 800;
    letter-spacing: 0.02em;
    line-height: 1.15;
  }
  .tagline{
    margin-top: 12px;
    font-size: 1rem;
    color: var(--ink-soft);
  }
  .meta{
    margin-top: 24px;
    font-family: var(--mono);
    font-size: 0.84rem;
  }
  .meta a{
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--ink-mute);
    padding-bottom: 2px;
    transition: border-color 0.18s ease;
  }
  .meta a:hover{border-bottom-color: var(--ink);}
  .meta a:focus-visible{outline: 2px solid var(--ink); outline-offset: 3px;}

  main{padding: 0;}

  .sec{
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 6px 36px;
    padding: 34px 0;
    border-bottom: 1px solid var(--rule);
  }
  .sec:last-child{border-bottom: none;}
  .sec h2{
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1.6;
  }
  .sec h2 span{
    display: block;
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }
  .text{
    max-width: 34em;
    font-size: 0.98rem;
    line-height: 1.95;
    color: var(--ink-soft);
  }

  footer.foot{
    margin-top: 6px;
    padding: 22px 0 56px;
    border-top: 2px solid var(--ink);
    font-family: var(--mono);
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    color: var(--ink-mute);
  }

  @media (max-width: 640px){
    .page{padding: 0 20px;}
    header.hero{padding: 52px 0 24px;}
    .sec{grid-template-columns: 1fr; gap: 10px; padding: 28px 0;}
    .sec h2 span{display: inline-block; margin: 0 0 0 8px;}
    footer.foot{padding-bottom: 40px;}
  }

  @media print{
    .page{max-width: none;}
    header.hero{padding-top: 0;}
  }
</style>
</head>
<body>
<div class="page">

  <header class="hero">
    <p class="kicker">个人简介 / Profile</p>
    <h1>胡玉豪</h1>
    <p class="tagline">嵌入式开发爱好者</p>
    <p class="meta"><a href="https://github.com/Yu6724">github.com/Yu6724</a></p>
  </header>

  <main>

    <section class="sec">
      <h2>基本信息<span>Profile</span></h2>
      <p class="text">胡玉豪，计科</p>
    </section>

    <section class="sec">
      <h2>技术方向<span>Focus</span></h2>
      <p class="text">想要参加软件嵌入式开发，对其有一定的了解和兴趣</p>
    </section>

    <section class="sec">
      <h2>技能<span>Skills</span></h2>
      <p class="text">能够使用 C 语言程序开发与基础语法逻辑，有 Python 基础，具备一定嵌入式开发能力，如 51 单片机的基础开发和外设驱动等</p>
    </section>

  </main>

  <footer class="foot">
    <p>© 2026 胡玉豪</p>
  </footer>
</div>
</body>
</html>
