<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="个人主页 - 个人简介、技能介绍与联系方式">
  <title>个人主页｜纪熙桓</title>
  <style>
    :root {
      --ink: #34434f;
      --ink-strong: #263844;
      --muted: #69747c;
      --line: #e7ecee;
      --paper: #ffffff;
      --soft: #f6f8f8;
      --accent: #b96d3d;
      --accent-soft: #f5ebe4;
      --footer: #2d3e50;
      --shadow: 0 16px 40px rgba(33, 47, 58, .09);
      --container: 950px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; }

    .container {
      width: min(calc(100% - 48px), var(--container));
      margin: 0 auto;
    }

    /* 顶部导航 */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 58px;
      background: rgba(255, 255, 255, .96);
      border-bottom: 1px solid rgba(220, 227, 230, .8);
      backdrop-filter: blur(12px);
    }

    .nav {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink-strong);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .brand-mark {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--footer);
      border-radius: 8px 8px 8px 2px;
      font-size: 12px;
      letter-spacing: 0;
      box-shadow: 0 5px 14px rgba(45, 62, 80, .2);
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 28px;
      margin: 0;
      padding: 0;
      list-style: none;
      color: #667079;
      font-size: 13px;
      white-space: nowrap;
    }

    .nav-links a {
      position: relative;
      display: block;
      padding: 17px 0;
      transition: color .2s ease;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 10px;
      width: 0;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
      transform: translateX(-50%);
      transition: width .25s ease;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible,
    .nav-links .active { color: var(--ink-strong); }

    .nav-links a:hover::after,
    .nav-links a:focus-visible::after,
    .nav-links .active::after { width: 18px; }

      background-size: cover;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 42px;
      background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, .22));
      pointer-events: none;
    }

    /* 主体 */
    .main {
      min-height: calc(100vh - 337px);
      padding: 27px 0 34px;
      background:
        radial-gradient(circle at 8% 22%, rgba(185, 109, 61, .035), transparent 25%),
        #fff;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 255px minmax(0, 1fr);
      column-gap: 80px;
      align-items: start;
    }

    /* 左侧个人卡片 */
    .profile { text-align: center; }

    .avatar {
      position: relative;
      width: 138px;
      height: 138px;
      margin: 0 auto 15px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background:
        linear-gradient(145deg, rgba(255,255,255,.14), transparent 48%),
        linear-gradient(145deg, #8b9ca6, #3e5969);
      border: 6px solid #fff;
      box-shadow: 0 14px 32px rgba(41, 59, 72, .18);
      font-family: Georgia, "Songti SC", serif;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: .05em;
      overflow: hidden;
    }

    .avatar::before,
    .avatar::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, .13);
    }

    .avatar::before {
      width: 95px;
      height: 95px;
      right: -34px;
      top: -28px;
    }

    .avatar::after {
      width: 68px;
      height: 68px;
      left: -22px;
      bottom: -20px;
    }

    .avatar img { position: relative; z-index: 2; width: 100%; height: 100%; display: block; object-fit: cover; }

    .profile-name {
      margin: 0;
      color: var(--ink-strong);
      font-size: 19px;
      line-height: 1.45;
      letter-spacing: .08em;
    }

    .profile-role {
      margin: 3px 0 18px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .info-list {
      margin: 0;
      padding: 16px 6px 0;
      border-top: 1px solid var(--line);
      text-align: left;
      font-size: 13px;
      line-height: 2.05;
    }

    .info-row {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      gap: 10px;
      min-height: 27px;
    }

    .info-row dt {
      color: #929ba1;
      letter-spacing: .08em;
    }

    .info-row dd {
      margin: 0;
      color: #53616c;
      overflow-wrap: anywhere;
    }

    /* 右侧正文 */
    .content { min-width: 0; }

    .section + .section { margin-top: 20px; }

    .section-body {
      min-height: 52px;
      margin-top: 12px;
      border-top: 1px solid var(--line);
    }

    .section-body p {
      margin: 0;
      color: #69737b;
      font-size: 14px;
      line-height: 1.9;
      text-align: justify;
    }

    .section-body p + p { margin-top: 6px; }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      color: var(--ink-strong);
      font-size: 17px;
      line-height: 1.5;
      font-weight: 700;
      letter-spacing: .05em;
    }

    .section-title::before {
      content: "";
      width: 4px;
      height: 18px;
      border-radius: 4px;
      background: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .about-text {
      margin: 20px 0 0;
      color: #69737b;
      font-size: 14px;
      line-height: 1.9;
      text-align: justify;
      letter-spacing: .015em;
    }

    .about-text + .about-text { margin-top: 16px; }

    .skill-list {
      margin: 25px 0 0;
      padding: 0;
      list-style: none;
    }

    .skill-item {
      position: relative;
      padding: 0 0 12px 25px;
    }

    .skill-item + .skill-item { margin-top: 14px; }

    .skill-item::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 9px;
      width: 9px;
      height: 9px;
      border: 2px solid var(--accent);
      transform: rotate(45deg);
    }

    .skill-item::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, var(--line), transparent 88%);
    }

    .skill-item:last-child::after { display: none; }

    .skill-name {
      display: block;
      margin: 0 0 2px;
      color: #40505d;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .skill-desc {
      margin: 0;
      color: #788188;
      font-size: 13px;
      line-height: 1.75;
      text-align: justify;
    }

    /* 页脚 */
    .site-footer {
      min-height: 58px;
      color: rgba(255, 255, 255, .74);
      background: var(--footer);
    }

    .footer-inner {
      min-height: 58px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 20px;
      font-size: 12px;
      letter-spacing: .06em;
    }

    .footer-brand {
      text-align: center;
      color: rgba(255, 255, 255, .9);
      font-size: 14px;
      letter-spacing: .18em;
    }

    .footer-contact {
      text-align: right;
      white-space: nowrap;
    }

    .footer-copy { white-space: nowrap; }

    /* 中等屏幕 */
    @media (max-width: 860px) {
      :root { --container: 720px; }
      .nav-links { gap: 20px; }
      .main-grid { grid-template-columns: 220px minmax(0, 1fr); column-gap: 45px; }
    }

    /* 移动端 */
    @media (max-width: 680px) {
      .container { width: min(calc(100% - 32px), var(--container)); }
      .site-header { height: auto; }
      .nav { min-height: 58px; align-items: flex-start; padding: 14px 0 0; }
      .brand { font-size: 16px; }
      .nav-links {
        max-width: 72%;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 2px 17px;
        line-height: 1.2;
      }
      .nav-links a { padding: 2px 0 8px; }
      .nav-links a::after { bottom: 4px; }
      .hero { height: 180px; }
      .main { padding-top: 28px; }
      .main-grid { grid-template-columns: 1fr; row-gap: 34px; }
      .profile { max-width: 340px; margin: 0 auto; }
      .avatar { width: 126px; height: 126px; }
      .info-list { padding-inline: 0; }
      .content { padding-top: 25px; border-top: 1px solid var(--line); }
      .footer-inner {
        padding: 13px 0;
        grid-template-columns: 1fr;
        gap: 2px;
        text-align: center;
      }
      .footer-contact, .footer-copy { text-align: center; white-space: normal; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { transition: none !important; }
    }
  </style>
</head>
