<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>林宇翔 | 个人简介</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      max-width: 760px;
      margin: 0 auto;
      padding: 56px 24px 72px;
      background: #ffffff;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      line-height: 1.75;
    }

    header {
      padding-bottom: 28px;
      border-bottom: 2px solid #111111;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 10px;
      font-size: clamp(2rem, 6vw, 3.2rem);
      line-height: 1.15;
    }

    header p {
      margin-bottom: 0;
      color: #444444;
    }

    main section {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 28px;
      padding: 34px 0;
      border-bottom: 1px solid #dddddd;
    }

    main section:last-child {
      border-bottom: 0;
    }

    h2 {
      margin-bottom: 0;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    section p:last-child,
    section ul:last-child {
      margin-bottom: 0;
    }

    ul {
      margin: 0;
      padding-left: 1.25em;
    }

    li + li {
      margin-top: 5px;
    }

    @media (max-width: 600px) {
      body {
        padding: 36px 20px 52px;
      }

      main section {
        grid-template-columns: 1fr;
        gap: 14px;
        padding: 28px 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>林宇翔</h1>
    <p>热爱学习与实践，关注计算机技术与数字创作</p>
  </header>

  <main>
    <section>
      <h2>技术方向与兴趣</h2>
      <div>
        <p>目前主要学习计算机基础知识，了解网页设计与前端开发，并尝试通过实践提升自己的编程能力。</p>
        <p>平时也对摄影、英语表达和数字媒体等方面感兴趣，希望通过不断学习发现更多可能。</p>
      </div>
    </section>

    <section>
      <h2>掌握的技能</h2>
      <ul>
        <li>HTML 与 CSS 基础</li>
        <li>基础网页设计与制作</li>
        <li>C++ 基础编程</li>
      </ul>
    </section>
  </main>
</body>
</html>
